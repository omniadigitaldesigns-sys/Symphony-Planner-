    <!-- Google Fonts: Inter & Playfair Display --> 
    <link rel="preconnect" href="https://fonts.googleapis.com"> 
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script> 
        tailwind.config = { 
            theme: { 
                extend: { 
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'], 
                        serif: ['Playfair Display', 'serif'], 
                    }, 
                    colors: { 
                        planner: { 
                            sand: '#F7F4F0', 
                            linen: '#FAF8F5', 
                            sage: '#8A9A86', 
                            sagesoft: '#DDE3DB', 
                            blush: '#E5C1B5',

                            charcoal: '#333A35',

    <style> 
        body { 
            background-color: #EFECE6; 
            background-image: radial-gradient(#DFDAD0 1px, transparent 1px); 
            background-size: 20px 20px; 
        } 
        /* Custom scrollbar for planner pages */ 
        .planner-scroll::-webkit-scrollbar { 
            width: 6px; 
        } 
        .planner-scroll::-webkit-scrollbar-track { 
            background: rgba(0, 0, 0, 0.02); 
        } 
        .planner-scroll::-webkit-scrollbar-thumb { 
            background: rgba(138, 154, 134, 0.3); 
            border-radius: 3px; 
        } 
        /* Grid and lined page backgrounds */ 
        .page-lined { 
            background-image: linear-gradient(#e5c1b5 1px, transparent 1px); 
            background-size: 100% 2rem; 
            line-height: 2rem; 
        } 
        .page-grid { 
            background-size: 20px 20px; 
            background-image: linear-gradient(to right, rgba(138, 154, 134, 0.08) 1px, transparent 1px), linear-gradient(to bottom, rgba(138, 154, 134, 0.08) 1px, transparent 1px); 
        } 
        .page-dotted { 
            background-image: radial-gradient(rgba(138, 154, 134, 0.15) 1px, transparent 1px); 
            background-size: 20px 20px; 
        } 
        /* Ring binder shadows and shapes */ 
        .binder-ring { 
            background: linear-gradient(90deg, #d1d5db 0%, #ffffff 50%, #9ca3af 100%); 
            box-shadow: inset 1px 1px 2px rgba(0,0,0,0.2), 2px 2px 4px rgba(0,0,0,0.15); 
        } 
        /* Stylized custom tabs */ 
        .tab-active { 
            transform: translateX(4px); 
            background-color: #FAF8F5 !important; 
            box-shadow: 2px 2px 5px rgba(0,0,0,0.05); 
            font-weight: 600; 
        } 
    </style> 

    <!-- PROGRESSIVE WEB APP LINKING SCRIPT -->
    <link rel="manifest" href="manifest.json">
    <script>

        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('Symphony offline setup complete!'))
          .catch((err) => console.log('Offline setup failed: ', err));

        function triggerExport() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "symphony_planner_backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast("Backup exported successfully!");
        }

        function triggerImport() {
            document.getElementById('importFile').click();
        }

        function handleImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedState = JSON.parse(e.target.result);
                    // Basic structural check
                    if (importedState && typeof importedState === 'object' && 'currentTab' in importedState) {
                        state = importedState;
                        savePlanner(true);
                        switchTab(state.currentTab);
                        showToast("Planner backup restored!");
                    } else {
                        openCustomAlert("Import Failed", "The uploaded file is not a valid Symphony Planner backup file.");
                    }
                } catch (err) {
                    openCustomAlert("Import Error", "Could not parse backup file. Make sure it is a valid backup .json file.");
                }
            };
            reader.readAsText(file);
        }

        function showToast(text) {
            const el = document.getElementById('toast');
            document.getElementById('toast-text').innerText = text;
            el.classList.remove('translate-y-12', 'opacity-0');
            el.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                el.classList.add('translate-y-12', 'opacity-0');
                el.classList.remove('translate-y-0', 'opacity-100');
            }, 3000);
        }

        function saveCustomHoliday(monthIdx) {
            const dayInput = document.getElementById('holiday_day');
            const nameInput = document.getElementById('holiday_name');
            const day = parseInt(dayInput.value);
            const name = nameInput.value.trim();
            const maxDays = AcademicMonths[monthIdx].days;

            if (isNaN(day) || day < 1 || day > maxDays) {
                openCustomAlert("Invalid Date", `Please enter a valid day between 1 and ${maxDays}.`);
                return;
            }
            if (!name) {
                openCustomAlert("Missing Name", "Please enter a title/name for your custom holiday.");
                return;
            }

            if (!state.holidays[monthIdx]) {
                state.holidays[monthIdx] = [];
            }

            state.holidays[monthIdx].push({ day, name });
            state.holidays[monthIdx].sort((a, b) => a.day - b.day);

            savePlanner(true);
            closeModal();
            renderCurrentTab();
            showToast("Holiday added successfully!");
        }

        }

        // Helper: Generates beautiful consistent checkbox with striking line transition
        function renderInteractiveChecklist(key, defaultLabel) {
            const isChecked = state.checklistData[key] || false;
            return `
                <label class="flex items-center gap-2.5 cursor-pointer">
                    <input type="checkbox" data-chk-key="${key}" ${isChecked ? 'checked' : ''} class="w-4 h-4 text-planner-sage rounded border-gray-300 focus:ring-planner-sage cursor-pointer">
                    <span class="text-xs transition text-planner-charcoal ${isChecked ? 'line-through text-gray-400 font-light' : ''}">${defaultLabel}</span>
                </label>
            `;
        }

        // Initialize and bind checklists change event listeners
        function initCheckboxes() {
            document.querySelectorAll('input[type="checkbox"][data-chk-key]').forEach(chk => {
                chk.addEventListener('change', (e) => {
                    const key = e.target.getAttribute('data-chk-key');
                    const checked = e.target.checked;
                    handleCheckboxToggle(key, checked);
                    
                    // Add line-through style to label text next to checkbox
                    const labelSpan = e.target.nextElementSibling;
                    if (labelSpan && labelSpan.tagName === 'SPAN') {
                        if (checked) {
                            labelSpan.classList.add('line-through', 'text-gray-400', 'font-light');
                        } else {
                            labelSpan.classList.remove('line-through', 'text-gray-400', 'font-light');
                        }
                    }
                });
            });
        }

        /* Pure Custom MODAL alert / confirm logic to avoid browser popups */
        function openCustomAlert(title, message) {
            const modal = document.getElementById('plannerModal');
            const content = document.getElementById('modal-content');
            content.innerHTML = `
                <div class="text-center space-y-4">
                    <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-amber-50 text-planner-gold mb-2 text-xl">
                        <i class="fa-solid fa-circle-exclamation"></i>
                    </div>
                    <h3 class="font-serif text-2xl text-planner-charcoal">${title}</h3>
                    <p class="text-sm text-planner-clay/90">${message}</p>
                    <div class="pt-2">
                        <button onclick="closeModal()" class="px-6 py-2 bg-planner-sage hover:bg-opacity-90 text-white font-medium text-xs rounded-full shadow transition">OK</button>
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
        }

        function openCustomConfirm(title, message, callback) {
            const modal = document.getElementById('plannerModal');
            const content = document.getElementById('modal-content');
            content.innerHTML = `
                <div class="text-center space-y-4">
                    <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-rose-50 text-rose-500 mb-2 text-xl">
                        <i class="fa-solid fa-trash-can"></i>
                    </div>
                    <h3 class="font-serif text-2xl text-planner-charcoal">${title}</h3>
                    <p class="text-sm text-planner-clay/90">${message}</p>
                    <div class="flex justify-center gap-3 pt-2">
                        <button onclick="closeModal()" class="px-5 py-2 bg-gray-100 hover:bg-gray-200 text-planner-clay font-medium text-xs rounded-full transition">Cancel</button>
                        <button id="modal-confirm-btn" class="px-5 py-2 bg-rose-600 hover:bg-rose-700 text-white font-medium text-xs rounded-full shadow transition">Proceed</button>
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
            document.getElementById('modal-confirm-btn').onclick = function() {
                callback();
                closeModal();
            }
        }

        /* Interactive Pencil Canvas (GoodNotes Overlay Style) */
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let penColor = '#8A9A86';
        let penWidth = 2;
        let isPenActive = false;
        let ctx = null;

        function toggleCanvasDraw() {
            const container = document.getElementById('canvasContainer');
            const penBtn = document.getElementById('penBtn');
            const canvas = document.getElementById('doodleCanvas');
            
            isPenActive = !isPenActive;
            if (isPenActive) {
                container.classList.remove('hidden');
                penBtn.classList.remove('bg-white');
                penBtn.classList.add('bg-planner-sagesoft');
                penBtn.innerHTML = `<i class="fa-solid fa-pen-nib text-planner-sage"></i> <span>Doodle Mode: Active</span>`;
                setupCanvas(canvas);
            } else {
                container.classList.add('hidden');
                penBtn.classList.remove('bg-planner-sagesoft');
                penBtn.classList.add('bg-white');
                penBtn.innerHTML = `<i class="fa-solid fa-pen-nib text-planner-sage"></i> <span>Doodle Mode: Off</span>`;
            }
        }

        function setupCanvas(canvas) {
            ctx = canvas.getContext('2d');
            
            // Adjust to visual size of current screen
            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = canvas.parentElement.offsetHeight;

            // Draw saved lines if any exists
            const savedDrawings = localStorage.getItem('symphony_planner_drawings');
            if (savedDrawings) {
                const img = new Image();
                img.onload = function() {
                    ctx.drawImage(img, 0, 0);
                };
                img.src = savedDrawings;
            }

            // Bind interactions (Desktop + Touch adaptation)
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);

            canvas.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY
                });
                canvas.dispatchEvent(mouseEvent);
            }, { passive: true });

            canvas.addEventListener('touchmove', (e) => {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY
                });
                canvas.dispatchEvent(mouseEvent);
            }, { passive: true });

            canvas.addEventListener('touchend', () => {
                const mouseEvent = new MouseEvent('mouseup', {});
                canvas.dispatchEvent(mouseEvent);
            }, { passive: true });
        }

        // Handle canvas auto-rescaling smoothly
        window.addEventListener('resize', () => {
            const canvas = document.getElementById('doodleCanvas');
            if (canvas && isPenActive) {
                // Temporary store drawings before resize
                const tempDrawing = canvas.toDataURL();
                canvas.width = canvas.parentElement.offsetWidth;
                canvas.height = canvas.parentElement.offsetHeight;
                
                const img = new Image();
                img.onload = function() {
                    ctx.drawImage(img, 0, 0);
                };
                img.src = tempDrawing;
            }
        });

        function startDrawing(e) {
            isDrawing = true;
            const canvas = document.getElementById('doodleCanvas');
            const rect = canvas.getBoundingClientRect();
            lastX = e.clientX - rect.left;
            lastY = e.clientY - rect.top;
        }

        function draw(e) {
            if (!isDrawing) return;
            const canvas = document.getElementById('doodleCanvas');
            const rect = canvas.getBoundingClientRect();
            const currentX = e.clientX - rect.left;
            const currentY = e.clientY - rect.top;

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(currentX, currentY);
            ctx.strokeStyle = penColor;
            ctx.lineWidth = penWidth;
            ctx.lineCap = 'round';
            ctx.stroke();

            lastX = currentX;
            lastY = currentY;
        }

        function stopDrawing() {
            if (isDrawing) {
                isDrawing = false;
                const canvas = document.getElementById('doodleCanvas');
                // Persist drawing content
                localStorage.setItem('symphony_planner_drawings', canvas.toDataURL());
            }
        }

        function setPenColor(color) {
            penColor = color;
        }

        function setPenWidth(width) {
            penWidth = width;
        }

        function clearCanvas() {
            const canvas = document.getElementById('doodleCanvas');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            localStorage.removeItem('symphony_planner_drawings');
            showToast("Canvas drawings cleared!");
        }

        // Initialize application window
        window.onload = function () {
            loadPlannerData();
            switchTab(state.currentTab);
        };
    </script>
</body>
</html>
